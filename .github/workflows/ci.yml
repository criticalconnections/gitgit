name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  backend:
    name: Backend (vet + test + build)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      # the Go binary embeds web/dist, so the frontend must exist to compile
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Verify git version (merge-tree --write-tree needs >= 2.38)
        run: git --version
      - run: gofmt -l . | tee /tmp/fmt && test ! -s /tmp/fmt
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go build -trimpath -o gitgit .
      - uses: actions/upload-artifact@v4
        with:
          name: gitgit-linux-amd64
          path: gitgit
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gitgit:ci .
