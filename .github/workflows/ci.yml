name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  backend:
    name: Backend (vet + test + build)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      # the Go binary embeds web/dist, so the frontend must exist to compile
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Verify git version (merge-tree --write-tree needs >= 2.38)
        run: git --version
      - run: gofmt -l . | tee /tmp/fmt && test ! -s /tmp/fmt
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go build -trimpath -o gitgit .
      - uses: actions/upload-artifact@v4
        with:
          name: gitgit-linux-amd64
          path: gitgit
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gitgit:ci .

  publish:
    name: Publish container image
    # Only from the canonical branch and tags: a fork's pull request must not
    # be able to push an image that customer instances then pull.
    if: github.event_name == 'push' && github.repository == 'criticalconnections/gitgit'
    needs: [frontend, backend, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # :latest only from main; a version tag also publishes :1 and :1.2
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 as well as amd64: Hetzner's CAX line is Ampere, and an
          # instance that cannot pull the image is a support ticket.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Confirm the image runs and reports its version
        run: |
          docker run --rm -d --name smoke -p 3000:3000 \
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz > /tmp/h.json; then
              cat /tmp/h.json
              grep -q '"ok":true' /tmp/h.json || { echo "unhealthy"; exit 1; }
              docker rm -f smoke
              exit 0
            fi
            sleep 2
          done
          echo "image never became healthy"; docker logs smoke; exit 1
